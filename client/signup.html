<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Inicio de sesión y creación de cuenta">
    <meta property="og:url" content="https://cuenta-one.vercel.app">
    <meta property="og:image" content="/img/image.svg">
    <meta property="og:description" content="Mostrando login de inicio y creación de cuenta">
    <meta name="description" content="Mostrando login de inicio y creación de cuenta">

    <title>Crear Cuenta</title>
    <link rel="shortcut icon" href="/img/image.svg" type="image/x-icon">
    <link rel="stylesheet" href="/css/materialize.css">
    <link rel="stylesheet" href="/css/main.css">


</head>

<body>
    <a href="/" class="btn btn-cl">
        Regresar</a>
    <main id="section-sig" class="bg-text">

        <div class="row">
            <div class="center">
                <h4>
                    Crear cuenta
                </h4>
            </div>
            <div class="center">
                <form class="col s12" method="post" action="/signup">
                    <div class="row">
                        <div class="input-field col s12">
                            <input id="nombre" type="text" name="name" placeholder="Usuario" class="validate white-text"  autofocus required>
                            <label for="email">Nombre</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <input id="email" type="email" name="email" placeholder="example@mailinator.com" class="validate white-text" required>
                            <label for="email">Email</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <input id="password" type="password" placeholder="*****" name="password" class="validate white-text" required>
                            <span id="visible"><img src="/img/visible.webp" alt="Ver contraseña"></span>
                            <label for="password">Contraseña</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <input id="confirm_password" type="password" placeholder="*****" name="confirm_password"
                                class="validate white-text" required>
                            <label for="confirm_password">Confirme Contraseña</label>
                        </div>
                    </div>
                    <button class="btn btn-block btn-c" type="submit">Cresar cuenta</button>
                </form>
            </div>
        </div>


    </main>
    <hr class="hr-section">
    <footer class="center">
        <div class="white-text">
            Ya tiene cuenta, inicie sesión a continuación
        </div>
        <a href="/signin" class="">Iniciar sesión</a>
    </footer>

    <span id="error-message"></span>
    <script src="/js/materialize.js"></script>
    <script type="module" src="/js/signup.js"></script>
</body>

</html>
