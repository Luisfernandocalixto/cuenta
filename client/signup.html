<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Inicio de sesión y creación de cuenta">
    <meta property="og:url" content="https://cuenta-one.vercel.app">
    <meta property="og:image" content="/image.svg">
    <meta property="og:description" content="Mostrando login de inicio y creación de cuenta">

    <title>Crear Cuenta</title>
    <link rel="shortcut icon" href="/image.svg" type="image/x-icon">
    <link rel="stylesheet" href="/materialize.css">
    <link rel="stylesheet" href="/main.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">


</head>

<body>
    <a href="/" class="btn btn-cl">
        Regresar</a>
    <section id="section-sig" class="bg-text">

        <div class="row">
            <div class="center">
                <h4>
                    Crear cuenta
                </h4>
            </div>
            <div class="center">
                <form class="col s12" method="post" action="/signup">
                    <div class="row">
                        <div class="input-field col s12">
                            <input id="nombre" type="text" name="name" class="validate white-text" required autofocus>
                            <label for="email">Nombre</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <input id="email" type="email" name="email" class="validate white-text" required>
                            <label for="email">Email</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <input id="password" type="password" name="password" class="validate white-text" required>
                            <span id="visible"><img src="/visible.webp" alt="Ver contraseña"></span>
                            <label for="password">Contraseña</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <input id="confirm_password" type="password" name="confirm_password"
                                class="validate white-text" required>
                            <label for="confirm_password">Confirme Contraseña</label>
                        </div>
                    </div>
                    <button class="btn btn-block btn-c" type="submit">Cresar cuenta</button>
                </form>
            </div>
        </div>


    </section>
    <hr class="hr-section">
    <div class="center">
        <div class="white-text">
            Ya tiene cuenta, inicie sesión a continuación
        </div>
        <a href="/signin" class="">Iniciar sesión</a>
    </div>

    <h1 id="error-message"></h1>
    <script src="/materialize.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // Capture the message of error of the URL
            const urlParamsSaved = window.location.search;
            let urlParamsConfig = urlParamsSaved.replace("signup?", "")
            let urlParams = new URLSearchParams(urlParamsConfig);
            const errorMessage = urlParams.get('error');
            if (errorMessage) {
                M.toast({ html: `<div class="toast-p">${decodeURI(errorMessage)}</div>` })
            }


            let visible = document.getElementById('visible');

            let input = document.getElementById('password');
            let inputConfirm = document.getElementById('confirm_password');
            visible.addEventListener('click', function () {
                if (input.type === 'password') {
                    input.type = "text";
                    inputConfirm.type = "text";
                    visible.innerHTML = `<img src="/invisible.webp" alt="invisible">`
                }
                else {
                    input.type = "password";
                    inputConfirm.type = "password";
                    visible.innerHTML = `<img src="/visible.webp" alt="visible">`

                }
            })

            let contentInfo = document.querySelector('label[for="password"]');
            let contentInfoConfirm = document.querySelector('label[for="confirm_password"]');
            // Expresión regular para validar la contraseña
            const regex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

            input.addEventListener('change', function () {
                // Validar la entrada del usuario y habilitar/deshabilitar el botón en consecuencia
                if (input.value.trim() !== '' & regex.test(input.value)) {
                    document.querySelector('button[type="submit"]').disabled = false;
                    contentInfo.textContent = 'Contraseña'
                    input.style.borderBottomColor = '#1b7a2d ';
                } else {
                    document.querySelector('button[type="submit"]').disabled = true;
                    contentInfo.textContent = 'La contraseña debe contener letras, números y al menos un símbolo.';

                    input.style.borderBottomColor = '#f44336';

                }
            });

            inputConfirm.addEventListener('change', function () {
                if (inputConfirm.value.trim() !== '' & regex.test(inputConfirm.value)) {
                    document.querySelector('button[type="submit"]').disabled = false;
                    contentInfoConfirm.textContent = 'Contraseña'
                    inputConfirm.style.borderBottomColor = '#1b7a2d ';
                } else {
                    document.querySelector('button[type="submit"]').disabled = true;
                    contentInfoConfirm.textContent = 'La contraseña debe contener letras, números y al menos un símbolo.';

                    inputConfirm.style.borderBottomColor = '#f44336';

                }
            });

        })
    </script>
</body>

</html>
