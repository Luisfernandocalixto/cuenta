<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Inicio de sesión y creación de cuenta">
    <meta property="og:url" content="https://cuenta-one.vercel.app">
    <meta property="og:image" content="https://cuenta-one.vercel.app/img/image.svg">
    <meta property="og:description" content="Mostrando login de inicio y creación de cuenta">
    <meta name="description" content="Mostrando login de inicio y creación de cuenta">
    <title>Login</title>
    <link rel="shortcut icon" href="/img/image.svg" type="image/x-icon">
    <link rel="stylesheet" href="/css/materialize.css">
    <link rel="stylesheet" href="/css/main.css">


</head>

<body>
    <a href="/" class="btn btn-cl">
        Regresar</a>
    <main id="section-sig" class="bg-text">

        <div class="row">
            <div class="center">
                <h4>
                    Ingresa
                </h4>
            </div>
            <div class="center">
                <form class="col s12 formSignIn">
                    <div class="row">
                        <div class="input-field col s12">
                            <input id="email" type="email" name="email" placeholder="example@mailinator.com" class="validate white-text" autofocus required>
                            <label for="email">Email</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <input id="password" type="password" placeholder="*****" name="password" class="validate white-text"
                                minlength="1" required>
                            <span id="visible"><img src="/img/visible.webp" alt="visible"></span>
                            <label for="password">Password</label>
                        </div>
                    </div>
                    <button class="btn btn-block btn-c" type="submit">Ingresar</button>
                </form>
            </div>
        </div>


    </main>
    <hr class="hr-section">
    <footer class="center">
        <div class="white-text">
            No tiene cuenta?, registrese a continuación
        </div>
        <a href="/signup" class="">Crear cuenta</a>
    </footer>

    <span id="error-message"></span>
    <script src="/js/materialize.js"></script>
    <script type="module" src="/js/signIn.js"></script>
</body>

</html>
